name: ubersy

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ubersy-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_COLLATION: Arabic_100_CI_AS
    ports:
      - "${DB_PORT:-1434}:1433"
    volumes:
      - ubersy_sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ubersy-api:latest
    container_name: ubersy-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=db;Database=UberSyDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      JwtSettings__Secret: ${JWT_SECRET}
      AdminSeed__Email: ${ADMIN_EMAIL}
      AdminSeed__Password: ${ADMIN_PASSWORD}
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  ubersy_sql_data:
